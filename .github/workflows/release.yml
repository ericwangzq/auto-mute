name: Build DMG

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: scripts/build_dmg.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/AutoMute.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
